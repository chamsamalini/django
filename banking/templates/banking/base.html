<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Simple Banking App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f7fb;
            color: #1f2937;
        }
        main {
            max-width: 800px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        .card {
            background: #ffffff;
            border: 1px solid #d7deea;
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1rem;
        }
        .messages {
            list-style: none;
            padding: 0;
        }
        .messages li {
            background: #e8f5e9;
            border: 1px solid #8bc34a;
            border-radius: 8px;
            padding: 0.75rem;
            margin-bottom: 0.75rem;
        }
        .errorlist {
            color: #b91c1c;
        }
        a {
            color: #1d4ed8;
            text-decoration: none;
        }
        nav a {
            margin-right: 1rem;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            border-bottom: 1px solid #d7deea;
            padding: 0.75rem;
            text-align: left;
        }
        button {
            background: #1d4ed8;
            color: #fff;
            border: 0;
            border-radius: 8px;
            padding: 0.75rem 1rem;
            cursor: pointer;
        }
        input {
            width: 100%;
            padding: 0.65rem;
            margin-top: 0.35rem;
            margin-bottom: 0.75rem;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
<main>
    {% if messages %}
        <ul class="messages">
            {% for message in messages %}
                <li>{{ message }}</li>
            {% endfor %}
        </ul>
    {% endif %}
    {% block content %}{% endblock %}
</main>
</body>
</html>
